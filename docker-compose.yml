services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opsatlas}
      POSTGRES_USER: ${POSTGRES_USER:-opsatlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsatlas-dev-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opsatlas} -d ${POSTGRES_DB:-opsatlas}"]
      interval: 5s
      timeout: 3s
      retries: 10

  dotnet-demo:
    build:
      context: ./apps/lab-service
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-opsatlas};Username=${POSTGRES_USER:-opsatlas};Password=${POSTGRES_PASSWORD:-opsatlas-dev-only};Timeout=2
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./apps/backend
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-opsatlas}
      DATABASE_USER: ${POSTGRES_USER:-opsatlas}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-opsatlas-dev-only}
      DOTNET_HEALTH_URL: http://dotnet-demo:8080/health/live
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      dotnet-demo:
        condition: service_started

  frontend:
    build:
      context: ./apps/frontend
      args:
        NEXT_PUBLIC_OPSATLAS_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_started
