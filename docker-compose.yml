services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opsatlas}
      POSTGRES_USER: ${POSTGRES_USER:-opsatlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opsatlas-dev-only}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opsatlas} -d ${POSTGRES_DB:-opsatlas}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./apps/backend
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-opsatlas}
      DATABASE_USER: ${POSTGRES_USER:-opsatlas}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-opsatlas-dev-only}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
